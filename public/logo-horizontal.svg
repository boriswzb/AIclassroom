<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1f;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#1a1a3f;stop-opacity:0" />
    </linearGradient>
    
    <!-- AI 光芒渐变 -->
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <!-- 文字渐变 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 强发光效果 -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 图标：AI大脑+书本 -->
  <g transform="translate(20, 12)" filter="url(#strongGlow)">
    <!-- 书本轮廓 -->
    <path d="M4 44 L4 18 Q4 14 8 14 L28 14 Q32 14 32 18 L32 44 Q32 48 28 48 L8 48 Q4 48 4 44Z" 
          fill="none" stroke="url(#aiGlow)" stroke-width="2" opacity="0.9"/>
    <path d="M4 30 L32 30" stroke="url(#aiGlow)" stroke-width="1.5" opacity="0.7"/>
    
    <!-- 书页线条 -->
    <line x1="9" y1="20" x2="26" y2="20" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="9" y1="24" x2="24" y2="24" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
    <line x1="9" y1="34" x2="26" y2="34" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="9" y1="38" x2="22" y2="38" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
    <line x1="9" y1="42" x2="18" y2="42" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
    
    <!-- AI 脑电波 -->
    <g transform="translate(18, 10)">
      <circle cx="0" cy="0" r="9" fill="url(#aiGlow)" opacity="0.15"/>
      <path d="M-6 0 Q-3 -6 0 0 Q3 6 6 0" 
            fill="none" stroke="url(#aiGlow)" stroke-width="2" stroke-linecap="round">
        <animate attributeName="d" 
                 values="M-6 0 Q-3 -6 0 0 Q3 6 6 0;M-6 0 Q-3 -8 0 0 Q3 8 6 0;M-6 0 Q-3 -6 0 0 Q3 6 6 0" 
                 dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- 主标题 -->
  <text x="70" y="32" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" 
        font-size="22" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">
    我的AI课堂
  </text>
  
  <!-- 副标题/ tagline -->
  <text x="72" y="50" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" 
        font-size="10" fill="#94a3b8" letter-spacing="1.5">
    智能学习新体验
  </text>
  
  <!-- 装饰线 -->
  <line x1="70" y1="57" x2="145" y2="57" stroke="url(#aiGlow)" stroke-width="1" opacity="0.5"/>
  
  <!-- 小闪电装饰 -->
  <g transform="translate(340, 25)" opacity="0.7">
    <path d="M0 0 L6 8 L4 8 L5 15 L-1 6 L1 6 Z" fill="url(#aiGlow)">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 装饰星星 -->
  <circle cx="355" cy="55" r="1" fill="#00d4ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="365" cy="45" r="0.8" fill="#7c3aed" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="375" cy="58" r="1.2" fill="#00d4ff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>